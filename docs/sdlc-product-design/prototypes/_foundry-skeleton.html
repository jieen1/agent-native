<!--
  Foundry 原型骨架（参考文件，不是屏）
  ==================================================
  每个原型屏都是自包含 HTML：把本文件的 <head> 与 <body> 骨架整体复制进去，
  再在 <main class="inset"> 里搭具体页面。规则：
  - 图标一律 Tabler webfont：<i class="ti ti-xxx"></i>；禁 emoji / 文字符号。
  - 颜色一律 var(--token)；状态底色用 color-mix 15% 形式（已有工具类）。
  - 屏间跳转一律 <a data-screen="s1-tracker-board.html">，不用真实 URL。
  - 数字、key、id 用 .mono。真实中文文案与真实数据形态（PAY-204 等）。
  - 默认 light；右上主题切换按钮切 .dark。
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry · 屏名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
<style>
/* ============ Foundry tokens ============ */
:root{
  --background:oklch(1 0 0); --foreground:oklch(.141 .005 285.82);
  --card:oklch(1 0 0); --muted:oklch(.967 .001 286.38);
  --muted-foreground:oklch(.552 .016 285.94);
  --border:oklch(.945 .003 286.32); --input:oklch(.92 .004 286.32);
  --ring:oklch(.705 .015 286.07);
  --primary:oklch(.21 .006 285.89); --primary-foreground:oklch(.985 0 0);
  --brand:oklch(.55 .16 255); --brand-foreground:oklch(.985 0 0);
  --success:oklch(.55 .16 145); --warning:oklch(.68 .15 85);
  --info:oklch(.55 .18 250); --destructive:oklch(.577 .245 27.33);
  --agent:oklch(.55 .14 300); --evidence:oklch(.48 .10 180);
  --chart-1:oklch(.55 .16 255); --chart-2:oklch(.65 .13 255);
  --chart-3:oklch(.75 .10 255); --chart-4:oklch(.84 .07 255); --chart-5:oklch(.92 .04 255);
  --sidebar:oklch(.985 .001 286.38); --panel:oklch(.972 .002 286.35);
  --radius:10px; --radius-sm:6px; --radius-md:8px; --radius-xl:14px;
  --font-sans:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
}
.dark{
  --background:oklch(.18 .005 285.82); --foreground:oklch(.985 0 0);
  --card:oklch(.21 .006 285.89); --muted:oklch(.274 .006 286.03);
  --muted-foreground:oklch(.705 .015 286.07);
  --border:oklch(1 0 0/.08); --input:oklch(1 0 0/.15);
  --primary:oklch(.92 .004 286.32); --primary-foreground:oklch(.21 .006 285.89);
  --brand:oklch(.65 .16 255); --success:oklch(.65 .14 145);
  --warning:oklch(.8 .14 85); --info:oklch(.65 .16 250); --destructive:oklch(.66 .2 27);
  --agent:oklch(.68 .13 300); --evidence:oklch(.62 .09 180);
  --chart-1:oklch(.72 .14 255); --chart-2:oklch(.62 .13 255);
  --chart-3:oklch(.52 .11 255); --chart-4:oklch(.42 .09 255); --chart-5:oklch(.32 .06 255);
  --sidebar:oklch(.16 .005 285.82); --panel:oklch(.215 .006 285.9);
}
/* ============ base ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:13px;line-height:1.55;color:var(--foreground);
  background:var(--background);-webkit-font-smoothing:antialiased;text-autospace:ideograph-alpha ideograph-numeric}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:oklch(0 0 0/.12);border-radius:3px}
.dark ::-webkit-scrollbar-thumb{background:oklch(1 0 0/.14)}
i.ti{font-size:16px;line-height:1;vertical-align:-2px}
/* ============ 原型导航条（每屏统一，最顶部） ============ */
.proto-bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:2px;
  padding:4px 10px;background:oklch(.18 .01 260);color:oklch(.8 .01 260);
  font-size:11px;overflow-x:auto;white-space:nowrap}
.proto-bar .pb-title{font-weight:600;color:oklch(.98 0 0);margin-right:8px;display:flex;gap:6px;align-items:center}
.proto-bar a{padding:3px 8px;border-radius:6px;cursor:pointer}
.proto-bar a:hover{background:oklch(1 0 0/.1)}
.proto-bar a.active{background:var(--brand);color:var(--brand-foreground)}
.proto-bar .pb-theme{margin-left:auto;padding:3px 8px;border-radius:6px;display:flex;gap:4px;align-items:center}
.proto-bar .pb-theme:hover{background:oklch(1 0 0/.1)}
/* ============ 应用外壳 ============ */
.app{display:flex;height:calc(100vh - 27px)}
.sidebar{width:232px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:10px;gap:2px;overflow-y:auto}
.sb-head{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;font-weight:600;font-size:13px}
.sb-head .logo{width:22px;height:22px;border-radius:6px;background:var(--brand);color:var(--brand-foreground);
  display:flex;align-items:center;justify-content:center}
.sb-search{display:flex;align-items:center;gap:6px;margin:0 4px 8px;padding:5px 8px;border:1px solid var(--border);
  border-radius:var(--radius-md);color:var(--muted-foreground);font-size:12px;background:var(--card)}
.sb-search kbd{margin-left:auto}
.sb-group{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);
  padding:12px 8px 4px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--radius-md);
  color:var(--foreground);font-size:13px;cursor:pointer}
.sb-item i{font-size:17px;color:var(--muted-foreground)}
.sb-item:hover{background:oklch(0 0 0/.045)}
.dark .sb-item:hover{background:oklch(1 0 0/.06)}
.sb-item.active{background:color-mix(in oklch,var(--brand) 12%,transparent);color:var(--brand);font-weight:500}
.sb-item.active i{color:var(--brand)}
.sb-item .count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.sb-item .dot-badge{margin-left:auto;min-width:16px;height:16px;padding:0 5px;border-radius:8px;
  background:var(--brand);color:var(--brand-foreground);font-size:10px;font-weight:600;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.inset{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--background)}
/* ============ 页头/工具栏 ============ */
.page-header{display:flex;align-items:center;gap:10px;padding:14px 24px 10px}
.page-header .ph-icon{width:30px;height:30px;border-radius:8px;background:var(--muted);
  display:flex;align-items:center;justify-content:center;color:var(--muted-foreground)}
.page-header h1{font-size:16px;font-weight:600}
.page-header .ph-count{font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground)}
.page-header .ph-sub{font-size:12px;color:var(--muted-foreground)}
.page-header .ph-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.toolbar{display:flex;align-items:center;gap:8px;padding:6px 24px 10px;border-bottom:1px solid var(--border)}
.content{flex:1;overflow:auto}
/* ============ 通用组件 ============ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-md);
  font-size:12.5px;font-weight:500;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{opacity:.9}
.btn-brand{background:var(--brand);color:var(--brand-foreground)}
.btn-outline{border-color:var(--border);background:var(--card)}
.btn-outline:hover{background:var(--muted)}
.btn-ghost:hover{background:var(--muted)}
.btn-danger{background:var(--destructive);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:3px 8px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:11.5px;font-weight:500;border:1px solid var(--border);background:var(--card)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:500}
.badge.b-success{background:color-mix(in oklch,var(--success) 14%,transparent);color:var(--success)}
.badge.b-warning{background:color-mix(in oklch,var(--warning) 16%,transparent);color:oklch(.55 .13 85)}
.dark .badge.b-warning{color:var(--warning)}
.badge.b-info{background:color-mix(in oklch,var(--info) 14%,transparent);color:var(--info)}
.badge.b-destructive{background:color-mix(in oklch,var(--destructive) 12%,transparent);color:var(--destructive)}
.badge.b-agent{background:color-mix(in oklch,var(--agent) 12%,transparent);color:var(--agent)}
.badge.b-brand{background:color-mix(in oklch,var(--brand) 12%,transparent);color:var(--brand)}
.badge.b-muted{background:var(--muted);color:var(--muted-foreground)}
.badge.b-evidence{background:color-mix(in oklch,var(--evidence) 12%,transparent);color:var(--evidence)}
kbd{font-family:var(--font-mono);font-size:10px;padding:1px 5px;border:1px solid var(--border);
  border-bottom-width:2px;border-radius:4px;background:var(--muted);color:var(--muted-foreground)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.card-pad{padding:14px 16px}
.section-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.group-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);font-weight:600}
.divider{height:1px;background:var(--border)}
/* 状态环（CSS 实现） */
.ring{width:14px;height:14px;border-radius:50%;flex-shrink:0;display:inline-block;position:relative}
.st-icon{width:14px;height:14px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:-2px;color:#fff}
.st-icon i{font-size:10px;line-height:1;display:block}
.st-icon.sm{width:12px;height:12px}.st-icon.sm i{font-size:8.5px}
.st-icon.lg{width:18px;height:18px}.st-icon.lg i{font-size:12.5px}
.st-icon.ok{background:var(--success)}.st-icon.err{background:var(--destructive)}.st-icon.warn{background:var(--warning)}.st-icon.inf{background:var(--info)}.st-icon.mut{background:var(--muted-foreground)}
.runbadge .st-icon{width:11px;height:11px}.runbadge .st-icon i{font-size:8px}
.ring.r-pending{border:1.6px dashed var(--muted-foreground)}
.ring.r-queued{border:1.6px solid var(--warning)}
.ring.r-queued::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--warning)}
.ring.r-running{border:1.6px solid var(--info);background:conic-gradient(var(--info) 0 50%,transparent 50% 100%)}
/* r-running 活跃脉动已收敛至 foundry-motion .fm-live(见挂类元素),旧 breathe keyframes 移除 */
.ring.r-review{border:1.6px solid var(--info);background:conic-gradient(var(--info) 0 75%,transparent 75% 100%)}
.ring.r-gate{border:1.6px solid var(--warning)}
.ring.r-gate::after{content:'';position:absolute;left:5.5px;top:3px;width:1.8px;height:7px;background:var(--warning)}
.ring.r-skipped{border:1.6px solid var(--muted-foreground);background:linear-gradient(135deg,transparent 45%,var(--muted-foreground) 45%,var(--muted-foreground) 55%,transparent 55%)}
/* 优先级信号条 */
.pbars{display:inline-flex;gap:1.5px;align-items:flex-end;height:12px}
.pbars span{width:3px;border-radius:1px;background:var(--border)}
.pbars span:nth-child(1){height:4px}.pbars span:nth-child(2){height:6.5px}
.pbars span:nth-child(3){height:9px}.pbars span:nth-child(4){height:12px}
.pbars.p0 span{background:var(--destructive)}
.pbars.p1 span:nth-child(-n+3){background:oklch(.55 .13 85)}
.pbars.p2 span:nth-child(-n+2){background:var(--info)}
.pbars.p3 span:nth-child(1){background:var(--muted-foreground)}
/* 头像 */
.avatar{width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0}
.avatar.a-agent{border-radius:6px;background:color-mix(in oklch,var(--agent) 15%,transparent);
  color:var(--agent);border:1px solid color-mix(in oklch,var(--agent) 40%,transparent)}
.avatar.a-brain{border-radius:6px;background:color-mix(in oklch,var(--brand) 15%,transparent);
  color:var(--brand);border:1px solid color-mix(in oklch,var(--brand) 40%,transparent)}
/* 表格 */
table.fd{width:100%;border-collapse:collapse;font-size:12.5px}
table.fd th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted-foreground);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--border)}
table.fd td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.fd tr:hover td{background:oklch(0 0 0/.02)}
.dark table.fd tr:hover td{background:oklch(1 0 0/.03)}
/* 动效(一次性/氛围循环模式见文末内联的 fm-motion 基建块;.shimmer/.impulse 与 fm-thinking/fm-live 语义重复,已移除) */
/* 空态 */
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px;color:var(--muted-foreground)}
.empty .e-icon{width:40px;height:40px;border-radius:50%;background:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:20px}
</style>
<style id="foundry-motion">
  /* ===== Foundry v3 Motion Tokens(multica 实证校准) ===== */
  :root {
    /* 一次性动效时长梯度 */
    --fm-dur-1: 120ms;   /* 微反馈:hover、图标切换 */
    --fm-dur-2: 240ms;   /* 小型:按钮/开关状态、Toast、菜单 */
    --fm-dur-3: 400ms;   /* 中型:对话框 enter、完成打勾、区块 reveal */
    --fm-dur-4: 700ms;   /* 大型:庆祝时刻、欢迎/空状态插画 */
    /* 氛围循环档(持续存在感,允许慢) */
    --fm-ambient-1: 1600ms;  /* 活跃脉动 */
    --fm-ambient-2: 2500ms;  /* thinking 扫光 */
    --fm-ambient-3: 3200ms;  /* 描边光束(仅单一 CTA 级场景) */
    /* 曲线 */
    --fm-ease-standard: cubic-bezier(0.4, 0, 0.2, 1);   /* 一切常规过渡 */
    --fm-ease-enter:    cubic-bezier(0.16, 1, 0.3, 1);   /* 进场从容 */
    --fm-ease-exit:     cubic-bezier(0.7, 0, 0.84, 0);   /* 离场干脆 */
    --fm-ease-bounce:   cubic-bezier(0.5, 1.5, 0.4, 1);  /* 仅庆祝时刻 */
    /* 位移与缩放(工具产品克制档) */
    --fm-shift-1: 4px;
    --fm-shift-2: 8px;
    --fm-scale-hover: 1.02;
    --fm-scale-active: 0.98;
  }

  /* ===== 模式 1:thinking / streaming 文字扫光(替代 spinner) ===== */
  @keyframes fm-text-shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .fm-thinking {
    background-image: linear-gradient(90deg,
      var(--muted-foreground) 0%, var(--muted-foreground) 35%,
      var(--foreground) 50%,
      var(--muted-foreground) 65%, var(--muted-foreground) 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: fm-text-shimmer var(--fm-ambient-2) linear infinite;
  }

  /* ===== 模式 2:活跃态克制脉动(只动色彩与阴影,不缩放) ===== */
  @keyframes fm-impulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--agent, var(--primary)) 35%, transparent); }
    50%      { box-shadow: 0 0 0 4px color-mix(in oklch, var(--agent, var(--primary)) 12%, transparent); }
  }
  .fm-live { animation: fm-impulse var(--fm-ambient-1) ease-in-out infinite; }

  /* ===== 模式 3:两段式完成(徽章回弹 → 打勾描边) ===== */
  @keyframes fm-complete-badge {
    0% { transform: scale(0); } 60% { transform: scale(1.12); } 100% { transform: scale(1); }
  }
  @keyframes fm-complete-check { to { stroke-dashoffset: 0; } }
  .fm-complete { animation: fm-complete-badge 500ms var(--fm-ease-bounce) both; }
  .fm-complete svg path, .fm-complete svg polyline {
    stroke-dasharray: 48; stroke-dashoffset: 48;
    animation: fm-complete-check var(--fm-dur-3) ease-out 350ms forwards;
  }

  /* ===== 模式 4:导航/加载进度扫条(与真实网络解耦的 pending 提示) ===== */
  @keyframes fm-nav-sweep {
    0% { transform: translateX(-100%); } 100% { transform: translateX(400%); }
  }
  .fm-nav-progress {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    overflow: hidden; pointer-events: none; z-index: 9999; display: none;
  }
  .fm-nav-progress[data-active="true"] { display: block; }
  .fm-nav-progress::before {
    content: ""; display: block; height: 100%; width: 25%;
    background: var(--primary);
    animation: fm-nav-sweep 1400ms var(--fm-ease-standard) infinite;
  }

  /* ===== 模式 5:低频页入场(纯 opacity 为主,克制位移) ===== */
  [data-fm-reveal] {
    opacity: 0; transform: translateY(var(--fm-shift-1));
    transition: opacity var(--fm-dur-3) var(--fm-ease-enter),
                transform var(--fm-dur-3) var(--fm-ease-enter);
  }
  [data-fm-reveal].fm-in { opacity: 1; transform: none; }
  /* overflow 容器内只准 opacity(防滚动条闪烁,multica 实证反例) */
  .fm-scroll [data-fm-reveal] { transform: none; }

  /* ===== 通用交互态统一 ===== */
  .fm-hover-lift { transition: transform var(--fm-dur-2) var(--fm-ease-standard),
                               box-shadow var(--fm-dur-2) var(--fm-ease-standard); }
  .fm-hover-lift:hover  { transform: translateY(calc(var(--fm-shift-1) * -1)); }
  .fm-hover-lift:active { transform: scale(var(--fm-scale-active)); }
  .fm-underline {
    background-image: linear-gradient(currentColor, currentColor);
    background-size: 0% 1px; background-position: 0 100%; background-repeat: no-repeat;
    transition: background-size var(--fm-dur-2) var(--fm-ease-standard);
  }
  .fm-underline:hover { background-size: 100% 1px; }
  /* 对话框/浮层节奏统一(配合各屏已有 dialog 实现) */
  .fm-overlay-enter { animation-duration: var(--fm-dur-3); animation-timing-function: var(--fm-ease-enter); }
  .fm-overlay-exit  { animation-duration: var(--fm-dur-2); animation-timing-function: var(--fm-ease-exit); }
  /* 手势/拖拽进行中禁过渡(挂在被拖动的容器上) */
  [data-fm-gesturing="true"], [data-fm-gesturing="true"] * { transition: none !important; }

  /* ===== 全量降级 ===== */
  @media (prefers-reduced-motion: reduce) {
    .fm-thinking, .fm-live, .fm-complete, .fm-complete svg path, .fm-complete svg polyline,
    .fm-nav-progress::before { animation: none !important; }
    /* 降级下打勾直接呈现:base 规则把 dashoffset 预置为 48,若只停动画勾形将永不可见 */
    .fm-complete svg path, .fm-complete svg polyline { stroke-dashoffset: 0; }
    .fm-thinking { color: var(--muted-foreground); background: none; }
    [data-fm-reveal] { opacity: 1; transform: none; transition: none; }
    .fm-hover-lift, .fm-underline, .fm-overlay-enter, .fm-overlay-exit { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<!-- 原型导航条：每屏统一；当前屏加 class="active" -->
<nav class="proto-bar">
  <span class="pb-title"><i class="ti ti-flame"></i>Foundry · SDLC 原型</span>
  <a data-screen="index.html">总览</a>
  <a data-screen="s1-tracker-board.html">看板</a>
  <a data-screen="s2-sprint-studio.html">规划工作台</a>
  <a data-screen="s3-ui-review.html">UI 评审</a>
  <a data-screen="s4-work-item.html">工作项</a>
  <a data-screen="s5-inbox.html">收件箱</a>
  <a data-screen="s6-sprint-cockpit.html">Sprint 驾驶舱</a>

<script id="foundry-motion-js">
  /* Foundry v3 motion runtime(零依赖) */
  (function () {
    var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* 低频页入场:一次性触发 */
    if (!reduced && 'IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('fm-in'); io.unobserve(e.target); }
        });
      }, { threshold: 0.15 });
      document.querySelectorAll('[data-fm-reveal]').forEach(function (el) { io.observe(el); });
    } else {
      document.querySelectorAll('[data-fm-reveal]').forEach(function (el) { el.classList.add('fm-in'); });
    }

    /* 数字计数动画:fmCountTo(el, target) —— rAF 插值,reduced 直接落值 */
    window.fmCountTo = function (el, target, opts) {
      var dur = (opts && opts.duration) || 400;
      var from = parseFloat((el.textContent || '0').replace(/[^0-9.-]/g, '')) || 0;
      var fmt = (opts && opts.format) || function (v) { return Math.round(v).toLocaleString(); };
      if (reduced || dur <= 0) { el.textContent = fmt(target); return; }
      var t0 = performance.now();
      function ease(t) { return 1 - Math.pow(1 - t, 3); } /* ≈ standard 曲线的收尾感 */
      function tick(now) {
        var p = Math.min(1, (now - t0) / dur);
        el.textContent = fmt(from + (target - from) * ease(p));
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    };

    /* 原型演示辅助:data-fm-count 声明式初始化 */
    document.querySelectorAll('[data-fm-count]').forEach(function (el) {
      var v = parseFloat(el.getAttribute('data-fm-count'));
      if (!isNaN(v)) window.fmCountTo(el, v);
    });
  })();
</script>
